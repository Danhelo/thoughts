name: Sync Vault Content

on:
  repository_dispatch:
    types: [vault-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Danhelo/second-brain
          token: ${{ secrets.VAULT_PAT }}
          path: vault

      - name: Copy publishable content
        run: |
          # Clean existing content (keep index.md)
          find content -mindepth 1 -not -name 'index.md' -delete 2>/dev/null || true

          # Copy only safe folders
          mkdir -p content/Ideas content/Materials content/Metanotes content/Projects

          cp -r vault/THE\ Journal/Ideas/* content/Ideas/ 2>/dev/null || true
          cp -r vault/Materials/* content/Materials/ 2>/dev/null || true
          cp -r vault/Metanotes/* content/Metanotes/ 2>/dev/null || true
          cp -r vault/Projects/* content/Projects/ 2>/dev/null || true

      - name: Commit and push if changed
        run: |
          git config user.name "vault-sync"
          git config user.email "sync@noreply.github.com"
          git checkout v4
          git add content/
          git diff --cached --quiet || git commit -m "sync: update vault content"
          git push
