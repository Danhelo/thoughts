name: Sync Vault Content

on:
  repository_dispatch:
    types: [vault-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.VAULT_PAT }}

      - uses: actions/checkout@v7
        with:
          repository: Danhelo/second-brain
          token: ${{ secrets.VAULT_PAT }}
          path: vault

      - name: Copy publishable content
        run: |
          # Only sync vault-sourced folders (preserve manually added content like Projects/Horus)
          rm -rf content/Ideas content/Materials content/Metanotes
          mkdir -p content/Ideas content/Materials content/Metanotes

          # Copy safe folders from vault
          cp -r vault/THE\ Journal/Ideas/* content/Ideas/ 2>/dev/null || true
          cp -r vault/Materials/*.md content/Materials/ 2>/dev/null || true
          cp -r vault/Metanotes/*.md content/Metanotes/ 2>/dev/null || true

          # Remove files that do NOT have publish: true (privacy gate)
          find content/Ideas content/Materials content/Metanotes -name '*.md' | while read f; do
            if ! grep -q 'publish: true' "$f" 2>/dev/null; then
              rm "$f"
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name "vault-sync"
          git config user.email "sync@noreply.github.com"
          git checkout v4
          git add content/
          git diff --cached --quiet || git commit -m "sync: update vault content"
          git push
